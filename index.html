<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Work Tracker</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:20px;
}
.container{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
h2{text-align:center;}
select,button{
  width:100%;
  padding:10px;
  margin:8px 0;
}
button{
  background:#007bff;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.card{
  background:#fff;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
hr{margin:20px 0;}
</style>
</head>

<body>

<div class="container">

<h2>Store Work Update</h2>

<label>Store Name:</label>
<select id="store">
<option>st1</option>
<option>st2</option>
<option>st4</option>
<option>s4</option>
</select>

<label>1 Work:</label>
<select id="work1">
<option>Done</option>
<option>Pending</option>
</select>

<label>2 Work:</label>
<select id="work2">
<option>Done</option>
<option>Pending</option>
</select>

<label>3 Work:</label>
<select id="work3">
<option>Done</option>
<option>Pending</option>
</select>

<button onclick="submitData()">Submit</button>

<hr>

<h2>Dashboard Panel</h2>
<div id="dashboard"></div>

<button onclick="downloadPDF()">Download PDF</button>

</div>

<script>

let storeData = JSON.parse(localStorage.getItem("storeData")) || [];

function submitData(){
  const store = document.getElementById("store").value;
  const work1 = document.getElementById("work1").value;
  const work2 = document.getElementById("work2").value;
  const work3 = document.getElementById("work3").value;

  const data = {
    store,
    work1,
    work2,
    work3,
    time:new Date().toLocaleString()
  };

  storeData.push(data);
  localStorage.setItem("storeData", JSON.stringify(storeData));

  displayData();
  alert("Submitted Successfully!");
}

function displayData(){
  const dashboard = document.getElementById("dashboard");
  dashboard.innerHTML="";

  storeData.forEach(d=>{
    dashboard.innerHTML += `
      <div class="card">
      <b>Store:</b> ${d.store}<br>
      Work 1: ${d.work1}<br>
      Work 2: ${d.work2}<br>
      Work 3: ${d.work3}<br>
      <small>${d.time}</small>
      </div>
    `;
  });
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;

  storeData.forEach((d,i)=>{
    doc.text(`Store: ${d.store}`,10,y); y+=7;
    doc.text(`Work1: ${d.work1}`,10,y); y+=7;
    doc.text(`Work2: ${d.work2}`,10,y); y+=7;
    doc.text(`Work3: ${d.work3}`,10,y); y+=7;
    doc.text(`Time: ${d.time}`,10,y); y+=10;
  });

  doc.save("store_report.pdf");
}

displayData();

</script>

</body>
</html>
